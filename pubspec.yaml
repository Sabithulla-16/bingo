name: bingo
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^17.5.0
  supabase_flutter: ^2.18.3
  google_fonts: ^8.2.1
  uuid: ^4.6.0
  shared_preferences: ^2.5.4
  audioplayers: ^6.7.1
  connectivity_plus: ^7.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#171A3E"
  adaptive_icon_foreground: "assets/branding/app_icon.png"
  adaptive_icon_foreground_inset: 21

flutter_native_splash:
  color: "#FAFAF7"
  image: "assets/branding/app_icon.png"
  android_12:
    image: "assets/branding/app_icon_foreground.png"
    color: "#FAFAF7"
    icon_background_color: "#FAFAF7"
  android: true
  ios: false
  web: false

flutter:
  uses-material-design: true

  assets:
    - assets/branding/
    - assets/icons/
    - assets/illustrations/
    - assets/images/
    - assets/images/screenshots/
    - assets/audio/
