name: bingo
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^17.5.0
  supabase_flutter: ^2.18.3
  google_fonts: ^8.2.1
  uuid: ^4.6.0
  shared_preferences: ^2.5.4
  audioplayers: ^6.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/branding/
    - assets/icons/
    - assets/illustrations/
    - assets/images/
    - assets/images/screenshots/
    - assets/audio/
